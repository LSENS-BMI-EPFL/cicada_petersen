[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cicada-petersen"
version = "0.1.0"
description = "Petersen lab extensions for CICADA: NWB lab conventions, lab analysis tools and lab plugins"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cicada-nwb>=0.4.0,<0.5",
    "cicada-analysis>=0.4.0,<0.5",
    "imageio>=2.31,<=2.37.3", # widefield movie average (no longer pulled in by cicada-analysis)
]

[project.optional-dependencies]
gui = ["cicada-gui>=0.4.0,<0.5"]
dev = ["pytest"]
# 3D brain view of the units (plugin "Unit 3D brain"): brain surface and interactive HTML figure
brain_atlas = [
    "iblatlas",
    "plotly>=5.0",
]

# session.petersen: the lab NWB submodule (the entry point name is the class's `name`)
[project.entry-points."cicada_nwb.lab_submodules"]
petersen = "cicada_petersen.nwb.petersen:NWBPetersenLab"

# the lab plugins: a package, walked for CicadaAnalysis subclasses
[project.entry-points."cicada_analysis.plugins"]
petersen = "cicada_petersen.plugins"

[tool.setuptools.packages.find]
where = ["."]
include = ["cicada_petersen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
